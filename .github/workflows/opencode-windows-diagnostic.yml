name: Diagnose OpenCode Windows command transport

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/opencode-windows-diagnostic.yml
      - scripts/diagnose-opencode-windows.py
      - koi/adapters/agent_backends.py

permissions:
  contents: read

jobs:
  real-cli:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: opencode-ai@1.19.5
            directory: opencode-ai
            label: v1
          - package: '@opencode/cli@2.3.0'
            directory: '@opencode/cli'
            label: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML
      - name: Install real CLI
        shell: pwsh
        env:
          CLI_PACKAGE: ${{ matrix.package }}
        run: npm install --prefix "$env:RUNNER_TEMP/opencode" $env:CLI_PACKAGE --no-audit --no-fund
      - name: Compare old onboarding and corrected adapter
        shell: pwsh
        env:
          CLI_DIRECTORY: ${{ matrix.directory }}
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
        run: python scripts/diagnose-opencode-windows.py --real-opencode "$env:RUNNER_TEMP/opencode/node_modules/$env:CLI_DIRECTORY/bin/opencode.exe" --output "$env:RUNNER_TEMP/real-opencode-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-opencode-${{ matrix.label }}
          path: ${{ runner.temp }}/real-opencode-result.json
          if-no-files-found: error
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install adapter import dependency
        run: python -m pip install PyYAML
      - name: Compare arguments, cmd wrapper, file and fixed adapter
        shell: pwsh
        run: python scripts/diagnose-opencode-windows.py --output "$env:RUNNER_TEMP/opencode-windows-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-windows-diagnostic
          path: ${{ runner.temp }}/opencode-windows-result.json
          if-no-files-found: error
