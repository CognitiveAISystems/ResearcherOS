name: Repair initial release checksums
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-initial-release-checksums.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Match checksum filenames to published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          for tag in ('v0.3.2', 'v0.3.2-beta-test.2'):
              release = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{os.environ["GH_REPO"]}/releases/tags/{tag}',
              ]))
              assert not release['draft']
              packages = [a for a in release['assets'] if a['name'].endswith(('.exe', '.AppImage'))]
              assert len(packages) == 2
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run(['gh', 'release', 'download', tag, '--pattern', 'SHA256SUMS.txt', '--dir', directory], check=True)
                  path = Path(directory) / 'SHA256SUMS.txt'
                  old = {name.replace(' ', '.'): digest for digest, name in
                         (line.split('  ', 1) for line in path.read_text().splitlines())}
                  for asset in packages:
                      assert asset['digest'] == 'sha256:' + old[asset['name']]
                  corrected = ''.join(f"{old[a['name']]}  {a['name']}\n" for a in packages)
                  if path.read_text() != corrected:
                      path.write_text(corrected)
                      subprocess.run(['gh', 'release', 'upload', tag, str(path), '--clobber'], check=True)
                  print(f'{tag}: checksum filenames verified')
          PY
