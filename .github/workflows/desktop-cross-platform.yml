name: Desktop macOS, Windows and Linux

on:
  workflow_dispatch:
  push:
    branches: [main, beta]
    tags: ["v*"]
    paths-ignore: ["installers/**"]
  pull_request:
    paths:
      - ".github/workflows/desktop-cross-platform.yml"
      - "tests/test_desktop_release_workflow.py"
      - "tests/test_desktop_mac_dmg.py"
      - "desktop/**"
      - "api/**"
      - "koi/**"
      - "web/**"
      - "agents/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release gates
        run: python3 -m unittest discover -s tests -p test_desktop_release_workflow.py
      - name: Check DMG verification
        run: python3 -m unittest discover -s tests -p test_desktop_mac_dmg.py
      - name: Validate release tag and source branch
        id: metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            branch=main
            prerelease=false
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta-test\.([1-9][0-9]*)$ ]]; then
            branch=beta
            prerelease=true
          else
            echo 'Expected vX.Y.Z or vX.Y.Z-beta-test.N' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "origin/$branch"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  desktop:
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        # Build against the oldest supported glibc, then test this same artifact
        # on newer Ubuntu releases below.
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Set package version from release tag
        shell: bash
        if: needs.release-metadata.outputs.version != ''
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: npm version --no-git-tag-version "$RELEASE_VERSION"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build bundled server
        run: python desktop/build_server.py
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Check bundled server
        run: node desktop/verify-server.cjs "${{ github.workspace }}/dist/researchos-server/researchos-server${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run pack:win -- --publish never
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npm run pack:linux -- --publish never
      - name: Build macOS DMG without Developer ID
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:mac:dmg -- --publish never
      - name: Smoke test macOS DMG installation
        if: runner.os == 'macOS'
        run: python desktop/verify_mac_dmg.py
      - name: Smoke test Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'ResearcherOS'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $destination 'ResearcherOS.exe'
          if (-not (Test-Path $exe)) { throw 'Installed application missing' }
          $env:RESEARCHOS_SMOKE_TEST = '1'
          $app = Start-Process -FilePath $exe -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Application smoke test failed: $($app.ExitCode)" }
      - name: Smoke test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          RESEARCHOS_SMOKE_TEST=1 xvfb-run -a timeout 60 "$RUNNER_TEMP/squashfs-root/AppRun" --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: ResearcherOS-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
          if-no-files-found: error

  linux-compatibility:
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ResearcherOS-ubuntu-22.04
          path: linux-artifact
      - name: Check the released AppImage on this Ubuntu version
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find linux-artifact -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          node desktop/verify-server.cjs "$RUNNER_TEMP/squashfs-root/resources/server/researchos-server"
          RESEARCHOS_SMOKE_TEST=1 xvfb-run -a timeout 75 "$RUNNER_TEMP/squashfs-root/AppRun" --no-sandbox

  publish-installers:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [release-metadata, desktop, linux-compatibility]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ResearcherOS-*
          merge-multiple: true
          path: built-installers
      - name: Publish verified installers to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Require every platform before publishing any release.
          test "$(find built-installers -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find built-installers -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find built-installers -maxdepth 1 -name '*-arm64.dmg' | wc -l)" -eq 1
          test "$(find built-installers -maxdepth 1 -name '*-x64.dmg' | wc -l)" -eq 1
          # GitHub replaces spaces in asset names; hash the published names.
          for file in built-installers/*.exe; do
            normalized="${file// /.}"
            if [[ "$file" != "$normalized" ]]; then mv -- "$file" "$normalized"; fi
          done
          (cd built-installers && sha256sum -- *.exe *.AppImage *.dmg > SHA256SUMS.txt)
          {
            if [[ "$PRERELEASE" == true ]]; then
              echo 'Канал beta-test: сборка для A/B-тестирования из ветки beta.'
            else
              echo 'Стабильный выпуск из ветки main.'
            fi
            echo
            echo 'В чате теперь можно выбрать не только агента, но и модель. Нажмите на название агента под полем ввода и наведите на нужного агента: справа откроется список моделей, которые сообщает установленная программа.'
            echo
            echo 'Claude Code доступен в чате и в окне «Новое дерево» для знакомства с проектом и построения дерева исследования. Перед использованием установите Claude Code и войдите в аккаунт; приложение должно видеть команду claude.'
            echo
            echo 'Windows: скачайте .exe. Linux x86_64: скачайте .AppImage и разрешите выполнение.'
            echo 'Git LFS и клонирование ResearcherOS для установки не нужны.'
            echo 'macOS: скачайте arm64.dmg для Apple Silicon или x64.dmg для Intel и перенесите приложение в Applications.'
            echo 'DMG без сертификата Developer ID и notarization. Если macOS блокирует первый запуск, разрешите его в Системных настройках → Конфиденциальность и безопасность.'
            echo 'Альтернатива для macOS: скрипт installers/Установить ResearcherOS.command в клоне репозитория.'
            echo
            echo "Source: $SOURCE_SHA"
            echo "Build and smoke checks: $BUILD_RUN_URL"
            echo 'Проверены установка и запуск macOS на Apple Silicon и Intel, установка и запуск Windows, запуск Linux на Ubuntu 22.04 и 24.04.'
            echo 'Проверка Gatekeeper после скачивания в браузере на отдельном Mac пока не выполнена.'
            echo 'Обновление поверх прежней установки и работа на физическом экране требуют отдельной проверки.'
          } > release-notes.md
          flags=(--prerelease=false)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" built-installers/*.exe built-installers/*.AppImage built-installers/*.dmg built-installers/SHA256SUMS.txt \
            --verify-tag --title "ResearcherOS $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
