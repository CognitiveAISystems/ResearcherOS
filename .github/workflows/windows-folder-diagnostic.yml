name: Check repository paths in published Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-folder-diagnostic.yml]
permissions:
  contents: read
jobs:
  installed-server:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Install published v0.3.835
        shell: pwsh
        run: |
          $url = 'https://github.com/CognitiveAISystems/ResearcherOS/releases/download/v0.3.835/ResearcherOS.Setup.0.3.835.exe'
          curl.exe -fL --retry 2 $url -o setup.exe
          if ($LASTEXITCODE) { throw 'Download failed' }
          $install = Start-Process .\setup.exe -ArgumentList '/S',"/D=$env:RUNNER_TEMP\ResearcherOS" -Wait -PassThru
          if ($install.ExitCode) { throw "Installer exited with $($install.ExitCode)" }
      - name: Compare external repository and Documents copy
        shell: python
        run: |
          import json, os, shutil, subprocess, urllib.request, urllib.error
          from pathlib import Path
          docs = Path.home() / "Documents"
          docs.mkdir(exist_ok=True)
          repo = Path(r"C:\Repos\Map")
          repo.mkdir(parents=True)
          subprocess.run(["git", "init", "-q", str(repo)], check=True)
          subprocess.run(["git", "-C", str(repo), "-c", "user.name=Test", "-c", "user.email=test@example.org",
                          "commit", "-qm", "initial", "--allow-empty"], check=True)
          duplicate = shutil.copytree(repo, docs / "Map-Test")
          server = Path(os.environ["RUNNER_TEMP"]) / "ResearcherOS/resources/server/researchos-server.exe"
          with subprocess.Popen([str(server)], stdout=subprocess.PIPE, text=True, encoding="utf-8") as proc:
              try:
                  for line in proc.stdout:
                      if line.startswith("{") and (url := json.loads(line).get("url")):
                          break
                  else:
                      raise RuntimeError("Server exited before announcing URL")
                  for folder in (repo, duplicate):
                      body = json.dumps({"path": str(folder), "workspace_root": str(docs)}).encode()
                      request = urllib.request.Request(url.rstrip("/") + "/api/desktop/onboarding/git-project",
                                                       data=body, headers={"Content-Type": "application/json"})
                      try:
                          result = urllib.request.urlopen(request, timeout=60)
                      except urllib.error.HTTPError as error:
                          result = error
                      with result:
                          report = f"{folder} - HTTP {result.status}: {result.read().decode()}"
                          print(report)
                          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                              print(report, file=output)
                          print(f"::notice::{report}")
              finally:
                  proc.terminate()
