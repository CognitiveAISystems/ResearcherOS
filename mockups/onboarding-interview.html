<style>
:root{font-family:Outfit,system-ui,sans-serif;color:#272333;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}.page{height:100vh;min-height:620px;display:flex;flex-direction:column}.header{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #ebe8ee}.brand{font:800 19px Syne,sans-serif;letter-spacing:-.055em;background:linear-gradient(95deg,#bd42a8,#745bd5 65%,#14a3bd);background-clip:text;color:transparent}.project{font-size:13px;color:#88818f}.project strong{font-weight:600;color:#4d4655}.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,42%) minmax(0,58%)}.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid #e9e5ed;background:#fff}.stages{display:flex;gap:20px;align-items:center;flex:none;padding:30px 44px 0}.stage{color:#aea8b2;font-size:13px;font-weight:500;white-space:nowrap}.stage.active{color:#7357c2;font-weight:700}.stage.done{color:#7e9185}.chat{flex:1;min-height:0;overflow:auto;padding:80px 44px 20px}.chat h1{font:700 28px/1.23 Syne,sans-serif;letter-spacing:-.035em;max-width:520px;margin:0 0 22px}.history{max-width:520px}.exchange{margin:0 0 30px;padding-left:14px;border-left:2px solid #e5dcf1;color:#827a89;font-size:13px;line-height:1.5}.exchange p{margin:0 0 6px}.exchange strong{font-weight:600;color:#60546a}.ask{max-width:520px;font-size:18px;line-height:1.5;color:#3b3544;margin:0}.composer{flex:none;padding:24px 44px 42px}.input{max-width:540px;border:1px solid #dcd6e4;border-radius:11px;overflow:hidden}.input:focus-within{border-color:#967dd1;box-shadow:0 0 0 3px #967dd117}textarea{width:100%;display:block;min-height:95px;max-height:190px;resize:vertical;padding:16px;border:0;outline:0;background:#fff;color:#2a2534;font-size:15px;line-height:1.4}.input-bottom{display:flex;justify-content:flex-end;padding:0 10px 10px}.send{background:#765bc8;border:0;border-radius:8px;padding:10px 17px;color:#fff;font-size:13px;font-weight:700}.send:disabled{opacity:.45}.right{position:relative;min-width:0;min-height:0;overflow:auto;background:#f9f8fc}.world{width:760px;height:690px;position:relative;margin:25px auto 0}.empty{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#aaa2af;font-size:14px;text-align:center}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{fill:none;stroke:url(#edge-grad);stroke-width:3;stroke-linecap:round;filter:url(#edge-glow)}.map-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;border:0;font:inherit;padding:7px 10px;box-shadow:0 8px 18px #634b8538;animation:appear .3s ease-out}.map-node::before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;background:var(--node-ring);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;opacity:.85}.map-node.problem{--node-ring:linear-gradient(135deg,#fff,#ff6bcb 40%,#3de8ff);width:235px;height:108px;border-radius:50%;background:radial-gradient(ellipse 80% 70% at 35% 28%,#fff 0%,#ffe8f8 40%,#c8b8ff 85%);color:#1a0a24;box-shadow:0 10px 32px #b07ca673}.map-node.problem::before{opacity:1}.map-node.cause{--node-ring:linear-gradient(135deg,#ffab40,#ff6bcb);width:190px;height:82px;border-radius:12px;background:linear-gradient(145deg,rgba(255,154,92,.95),rgba(255,107,203,.9));box-shadow:0 9px 25px #e180ab55}.map-node.remediation{--node-ring:linear-gradient(135deg,#9b5cff,#ff6bcb);width:176px;height:72px;border-radius:4px;background:linear-gradient(145deg,rgba(155,92,255,.95),rgba(255,107,203,.85));box-shadow:0 9px 25px #9b5cff4b}.map-node.method{--node-ring:linear-gradient(135deg,#3de8ff,#7b5cff);width:171px;height:69px;border-radius:6px;background:linear-gradient(145deg,rgba(61,232,255,.75),rgba(123,92,255,.85));box-shadow:0 9px 25px #6497db57}.node-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin-bottom:3px}.problem .node-label{color:#643c75}.node-title{display:block;width:100%;font-size:11px;line-height:1.28;font-weight:600;overflow-wrap:anywhere;text-shadow:0 1px 2px #0003}.problem .node-title{font-size:12px;font-weight:500;text-shadow:none}.map-node.remediation .node-title,.map-node.method .node-title{font-size:10px}@keyframes appear{from{opacity:0;transform:translate(-50%,-43%) scale(.93)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-width:900px){.page{height:auto;min-height:100vh}.body{grid-template-columns:1fr}.left{min-height:570px;border-right:0;border-bottom:1px solid #e9e5ed}.chat{padding-top:65px}.right{min-height:690px}}@media(max-width:600px){.header{padding:0 18px}.stages{gap:12px;padding:24px 18px 0}.stage{font-size:11px}.chat{padding:60px 18px 20px}.chat h1{font-size:24px}.ask{font-size:16px}.composer{padding:20px 18px 30px}.world{margin:15px 0 0}}

/* Продолжение существующего мастера настройки рабочей папки. */
body{background:#e7e7f0}
.backdrop{min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 14% 18%,rgba(199,77,190,.17),transparent 28%),radial-gradient(circle at 84% 76%,rgba(38,173,220,.18),transparent 32%),#e7e7f0}
.page{width:min(1180px,100%);height:min(92vh,820px);min-height:620px;border:1px solid #d8d5e7;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 26px 85px rgba(49,36,78,.25)}
.header{height:auto;display:block;flex:none;padding:30px 44px 23px;border-bottom:1px solid #dce3e6;background:radial-gradient(circle at 6% 2%,rgba(198,66,177,.11),transparent 30%),radial-gradient(circle at 89% 0%,rgba(39,166,218,.12),transparent 32%),linear-gradient(180deg,#f9f8ff,#fff)}
.header-top{display:flex;justify-content:space-between;align-items:center}.header .brand{font-size:16px;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(90deg,#ae2d9f,#7663d9,#078db5);background-clip:text}.project{color:#667180}.project strong{color:#314956}
.stages{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0 0}.stage{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 7px;border:1px solid #dce3e6;border-radius:999px;background:#ffffffa6;color:#667180;font-size:13px}.stage i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#f1f3f5;font-size:11px;font-weight:800;font-style:normal}.stage.active{border-color:#8561d8;background:#f4efff;color:#1b2430}.stage.active i{background:linear-gradient(135deg,#a941bc,#655fe3 55%,#078db5);color:#fff}.stage.done{color:#314956}.stage.done i{background:#e4f5ef;color:#43886f}
.body{border-top:0;min-height:0}.left{border-right:1px solid #dce3e6}.chat{padding-top:58px}.chat h2{font:700 27px/1.25 Syne,Outfit,sans-serif;letter-spacing:-.03em;max-width:520px;margin:0 0 22px;color:#1b2430}.ask{font-size:17px;color:#36404d}.send{min-height:46px;padding:10px 17px;border:1px solid #8061d7;border-radius:10px;background:linear-gradient(100deg,#a73bb9,#7260df 58%,#168fb8);color:#fff;font-weight:700}.send:hover:not(:disabled){filter:brightness(.94)}.send:focus-visible{outline:3px solid #8460d8;outline-offset:2px}.input{border-color:#cdd9df}.right{background:#f7f8fc}
@media(max-width:900px){.backdrop{padding:12px;display:block}.page{height:auto;min-height:0;max-height:none;margin:auto}.header{padding:26px 24px 22px}.body{display:block}.left{min-height:480px}.right{min-height:600px}.chat{padding-top:42px}}
@media(max-width:600px){.header{padding:24px 20px 20px}.project{font-size:11px}.stages{gap:6px;padding-top:20px}.stage{padding:5px 8px 5px 5px;font-size:11px;gap:5px}.stage i{width:19px;height:19px}.chat h2{font-size:23px}}

/* Кнопка из текущего чата ResearchOS. */
.input{border-radius:20px;padding:12px;background:#fff}
.input:focus-within{border-color:#765bc8;box-shadow:0 0 0 2px rgba(107,66,212,.06)}
.input textarea{min-height:54px;max-height:180px;padding:2px 4px;border:0;background:transparent;font-size:14px}
.input-bottom{padding:0;justify-content:flex-end}
.send{display:grid;place-items:center;width:36px;height:36px;min-height:36px;padding:0;border:0;border-radius:50%;background:linear-gradient(100deg,#a73bb9,#7260df 58%,#168fb8);box-shadow:0 0 18px rgba(255,107,203,.18)}
.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:hover:not(:disabled){filter:none;box-shadow:0 0 18px rgba(255,107,203,.22),0 0 14px rgba(61,232,255,.18)}
.send:disabled{opacity:.6;cursor:wait}
/* Анимация agent из method-activity у карточек running. */
.empty{display:flex;flex-direction:column;align-items:center;gap:13px;min-width:320px}
.empty[hidden]{display:none}
.empty .method-activity-svg{display:block;width:176px;height:88px;overflow:visible}
.ma-floor{fill:rgba(123,92,255,.16)}
@keyframes ma-pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ma-orbit-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes ma-orbit-spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0)}}
.ma-core,.ma-core-ring{animation:ma-pulse 1.8s ease-in-out infinite;transform-origin:center}
.ma-core-ring{fill:none;stroke:#3de8ff;stroke-width:1;opacity:.45}
.ma-orbit{transform-origin:44px 22px}
.theme-agent .ma-orbit-a{animation:ma-orbit-spin 4s linear infinite}
.theme-agent .ma-orbit-b{animation:ma-orbit-spin-rev 5.5s linear infinite}
.theme-agent .ma-orbit-c{animation:ma-orbit-spin 7s linear infinite}
.ma-q{font-family:Syne,sans-serif;font-size:9px;font-weight:800;fill:#ff6bcb;animation:ma-pulse 2.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.ma-core,.ma-core-ring,.ma-orbit,.ma-q{animation:none!important}}

/* Вопросы и ответы оформлены как сообщения чата. */
.chat{padding-top:42px;padding-bottom:20px}
.message-row{display:flex;align-items:flex-end;gap:10px;max-width:560px;margin:0 0 18px}
.agent-row{justify-content:flex-start}
.user-row{justify-content:flex-end;margin-left:auto}
.agent-avatar{flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,#f4dfee,#e8e2fa);color:#8c5cb5;font-size:17px;line-height:1}
.message-bubble{max-width:min(88%,460px);padding:13px 17px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.agent-bubble{border:1px solid #e7e0ef;border-radius:16px 16px 16px 5px;background:#f6f3fa;color:#34303e}
.user-bubble{border:1px solid #dceef1;border-radius:16px 16px 5px 16px;background:#eef8fa;color:#2d4350}
.input textarea{height:54px;min-height:54px;max-height:180px;resize:none;overflow-y:auto;box-sizing:border-box}
@media(max-width:600px){.chat{padding-top:30px}.message-bubble{font-size:14px}}
</style>
</head>
<body><div class="backdrop"><div class="page"><header class="header"><div class="header-top"><div class="brand">ResearchOS</div><div class="project">Репозиторий <strong>craftax-agent</strong></div></div><nav class="stages" id="stages" aria-label="Этапы интервью"></nav></header><main class="body"><section class="left" aria-label="Интервью"><div class="chat" id="chat"><div class="history" id="history"></div><div class="message-row agent-row"><span class="agent-avatar" aria-hidden="true">✦</span><div class="message-bubble agent-bubble" id="question"></div></div></div><div class="composer"><div class="input"><textarea id="answer" rows="1" aria-label="Ответ" placeholder="Ваш ответ…"></textarea><div class="input-bottom"><button class="send" id="send" type="button" aria-label="Отправить сообщение" title="Отправить сообщение"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button></div></div></div></section><section class="right" aria-label="Дерево исследования"><div class="world"><svg class="edges" id="edges" viewBox="0 0 760 690" aria-hidden="true"><defs><linearGradient id="edge-grad" x1="0%" x2="100%"><stop offset="0%" stop-color="#ff6bcb"/><stop offset="50%" stop-color="#7b5cff"/><stop offset="100%" stop-color="#3de8ff"/></linearGradient><filter id="edge-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3de8ff"/></marker></defs></svg><div id="nodes"></div><div class="empty" id="empty"><svg class="method-activity-svg theme-agent" viewBox="0 0 88 44" aria-hidden="true"><defs><linearGradient id="empty-agent-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6bcb"/><stop offset="50%" stop-color="#7b5cff"/><stop offset="100%" stop-color="#3de8ff"/></linearGradient></defs><ellipse class="ma-floor" cx="44" cy="38" rx="28" ry="4"/><circle class="ma-core" cx="44" cy="22" r="9" fill="url(#empty-agent-grad)"/><circle class="ma-core-ring" cx="44" cy="22" r="13"/><g class="ma-orbit ma-orbit-a"><circle cx="44" cy="8" r="2.5" fill="#3de8ff"/></g><g class="ma-orbit ma-orbit-b"><circle cx="68" cy="22" r="2" fill="#ff6bcb"/></g><g class="ma-orbit ma-orbit-c"><circle cx="44" cy="36" r="1.8" fill="#85c76d"/></g><text class="ma-q" x="58" y="14">?</text></svg><span>Здесь появится дерево вашего исследования</span></div></div></section></main></div></div>
<script>
const stages=[{name:'Проблема',question:'Что в работе этого проекта вы хотите исследовать?',node:'Агент теряет цель в длинных эпизодах'},{name:'Причина',question:'Что, по вашему мнению, вызывает эту трудность?',node:'Контекст прошлых действий быстро теряется'},{name:'Гипотеза',question:'Какое изменение могло бы помочь?',node:'Резюме траектории поможет удерживать цель'},{name:'Метод',question:'С чем сравнить новый подход, чтобы проверить гипотезу?',node:'Сравнить агента с памятью и без неё'}];const kinds=['problem','cause','remediation','method'];const pos=[{x:380,y:107,w:235,h:108},{x:380,y:268,w:190,h:82},{x:380,y:421,w:176,h:72},{x:380,y:566,w:171,h:69}];let answers=[];const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let n=answers.length;$('stages').innerHTML=stages.map((s,i)=>`<span class="stage ${i<n?'done':i===n?'active':''}"><i>${i<n?'✓':i+1}</i>${s.name}</span>`).join('');$('history').innerHTML=answers.map((a,i)=>`<div class="message-row agent-row"><span class="agent-avatar" aria-hidden="true">✦</span><div class="message-bubble agent-bubble">${esc(stages[i].question)}</div></div><div class="message-row user-row"><div class="message-bubble user-bubble">${esc(a)}</div></div>`).join('');$('question').textContent=n<4?stages[n].question:'Посмотрите, каким получилось дерево.';$('empty').hidden=n>0;$('nodes').innerHTML=answers.map((_,i)=>`<div class="map-node ${kinds[i]}" style="left:${pos[i].x}px;top:${pos[i].y}px"><span class="node-label">${stages[i].name}</span><span class="node-title">${esc(stages[i].node)}</span></div>`).join('');$('edges').querySelectorAll('.edge').forEach(e=>e.remove());for(let i=1;i<n;i++){const a=pos[i-1],b=pos[i],e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('class','edge');e.setAttribute('d',`M${a.x} ${a.y+a.h/2} Q${a.x+12} ${(a.y+a.h/2+b.y-b.h/2)/2} ${b.x} ${b.y-b.h/2}`);e.setAttribute('marker-end','url(#arrow)');$('edges').appendChild(e)}$('send').disabled=n===4;$('answer').disabled=n===4;$('answer').placeholder=n===4?'':'Ваш ответ…';sizeAnswer();$('chat').scrollTop=$('chat').scrollHeight}
function sizeAnswer(){const el=$('answer');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,180)+'px'}function send(){let a=$('answer').value.trim();if(!a||answers.length===4)return;answers.push(a);$('answer').value='';render()}$('send').addEventListener('click',send);$('answer').addEventListener('input',sizeAnswer);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});render();
</script></body></html>
